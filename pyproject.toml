[project]
name = "rootlogic"
version = "0.1.0"
description = "Agentic personal research assistant: plans, searches, reflects, cites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7",
    "pydantic>=2.7",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rootlogic = "rootlogic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rootlogic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
