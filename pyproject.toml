[project]
name = "rootlogic"
version = "0.1.0"
description = "Agentic personal research assistant: plans, searches, reflects, cites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7",
    "pydantic>=2.7",
    "rich>=13",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
openai = ["openai>=3.17"]
langfuse = ["langfuse>=2.50"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "openai>=3.17"]

[project.scripts]
rootlogic = "rootlogic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rootlogic*"]

[tool.setuptools.package-data]
rootlogic = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
